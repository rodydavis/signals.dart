name: Automated Package Publisher

on:
  push:
    branches:
      - main # Or your release branch

concurrency:
  group: publish
  cancel-in-progress: false # Do not cancel in-progress runs to avoid partial/broken releases

jobs:
  publish:
    # This must match the environment name you configured on pub.dev
    environment: pub.dev 
    permissions:
      id-token: write # Mandatory for OIDC authentication with pub.dev
      contents: write  # Allows pushing git tags and changelog updates back to your repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so Melos can parse conventional commits

      - name: Setup Dart/Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Melos Action manages setup, bootstrapping, and execution
      - name: Setup Melos Workspace
        uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: true

      # Optional: Add testing/linting checks before attempting release
      - name: Run Quality Checks
        run: |
          melos exec -- dart analyze
          melos exec -- dart test

      - name: Dry-Run Publication Validation
        run: melos publish --dry-run

      # Melos automatically versions changed packages and pushes them to pub.dev
      - name: Version and Publish Packages
        run: |
          # Configure Git so Melos can push changelog updates and version bumps
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Automatically calculate versions, apply git tags, and release
          melos version --yes
          melos publish --no-dry-run --yes
